name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Node dependencies
        run: npm ci --include=dev

      - name: Build non-email-login website
        run: bash scripts/build-no-email.sh

      - name: Check out the part-number edition
        uses: actions/checkout@v6
        with:
          ref: e0f2eebba5025c70a13e9fc06a685075daaa407a # modern-part-number
          path: part-edition
          persist-credentials: false

      - name: Build the part-number edition
        working-directory: part-edition
        run: |
          npm ci --include=dev
          bash scripts/build-no-email.sh

      - name: Assemble both editions
        run: |
          mkdir -p dist/part-number
          cp -a part-edition/dist/. dist/part-number/
          test -f dist/index.html
          test -f dist/part-number/index.html
          grep -q 'AUTOREPORT · 料號版' dist/part-number/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
